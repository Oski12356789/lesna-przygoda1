
name: Buduj APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Przygotuj Javę
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Akceptuj licencje Android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses || true
          "$SDK" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Znajdź projekt
        id: project
        run: |
          FILE=$(find . -name settings.gradle -type f | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Nie znaleziono settings.gradle"
            find . -maxdepth 5 -type f
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Projekt: $DIR"

      - name: Przygotuj Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Buduj APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          gradle assembleDebug

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: Lesna-Przygoda-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error

