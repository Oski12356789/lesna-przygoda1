
name: Buduj APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Akceptuj licencje Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rozpakuj projekt
        run: unzip Lesna_Przygoda_Android_Project.zip -d project

      - name: Zbuduj APK
        run: cd project && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Lesna-Przygoda-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
